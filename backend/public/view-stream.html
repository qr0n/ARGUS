<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ARGUS - Live Command Center</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1b1e;
            color: #e4e5e8;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #272930;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #3bb4f2;
        }

        .status-pill {
            font-family: 'IBM Plex Mono', monospace;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-pill.online {
            background: rgba(56, 211, 153, 0.15);
            color: #38d399;
            border-color: rgba(56, 211, 153, 0.3);
        }

        .main-view {
            position: relative;
            width: 100vw;
            height: calc(100vh - 200px);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video,
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        canvas {
            pointer-events: none;
            z-index: 10;
        }

        .bottom-panel {
            height: 200px;
            padding: 20px 32px;
            background: #272930;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: #e4e5e8;
        }

        .panel-header .count {
            color: #3bb4f2;
            font-family: 'IBM Plex Mono', monospace;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            height: 100%;
        }

        .match-row {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            gap: 16px;
        }

        .match-avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background: #555963;
        }

        .match-avatar.verified {
            background: #f0a832;
        }

        .match-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .match-name {
            font-size: 14px;
            font-weight: 600;
        }

        .match-progress {
            height: 6px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .match-progress .fill {
            height: 100%;
            background: #f0a832;
        }

        .match-conf {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: #909296;
        }

        .match-conf.high {
            color: #f0a832;
            font-weight: bold;
        }

        #playBtn {
            position: absolute;
            display: none;
            z-index: 20;
            background: rgba(59, 180, 242, 0.2);
            color: #3bb4f2;
            font-family: 'IBM Plex Mono', monospace;
            border: 1px solid #3bb4f2;
            padding: 16px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>

    <!-- Load face-api.js from CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>

<body>

    <div class="top-bar">
        <div class="brand">ARGUS COMMAND</div>
        <div>
            <span class="status-pill" id="statusPill">STREAM OFFLINE</span>
        </div>
    </div>

    <div class="main-view">
        <video id="video" muted playsinline></video>
        <canvas id="overlay"></canvas>
        <button id="playBtn">Tap to Play Stream</button>
    </div>

    <div class="bottom-panel">
        <div class="panel-header">
            <span>Live Face Detection</span>
            <span>Matches Found: <span class="count" id="matchCounter">0</span></span>
        </div>
        <div class="matches-list" id="matchesList">
            <!-- Live population -->
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const playBtn = document.getElementById('playBtn');
        const statusPill = document.getElementById('statusPill');
        const matchesList = document.getElementById('matchesList');
        const matchCounter = document.getElementById('matchCounter');

        let faceMatcher = null;
        let isDetecting = false;

        // ----------- 1. WebRTC SIGNALING -----------
        // Each paired phone is its own room: /view-stream?device=<id>
        // (the dashboard's Live Camera page lists devices and is the main viewer).
        const deviceId = new URLSearchParams(window.location.search).get('device') || '';
        if (!deviceId) statusPill.textContent = 'NO DEVICE SELECTED — use the dashboard Live Camera page';
        const wsUrl = `wss://${window.location.host}/ws-view?device=${encodeURIComponent(deviceId)}`;
        const ws = new WebSocket(wsUrl);
        let pc = null;

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            console.log('WS msg:', msg);

            if (msg.type === 'offer') {
                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

                pc.ontrack = (e) => {
                    video.srcObject = e.streams[0];
                    video.play().catch(() => {
                        playBtn.style.display = 'block';
                        playBtn.onclick = () => { video.play(); playBtn.style.display = 'none'; };
                    });
                    statusPill.textContent = 'LIVE VIEW';
                    statusPill.classList.add('online');
                };

                pc.onicecandidate = (e) => {
                    if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
                };

                await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));

            } else if (msg.type === 'ice' && pc) {
                if (msg.candidate) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } else if (msg.type === 'streamer-gone') {
                statusPill.textContent = 'STREAM OFFLINE';
                statusPill.classList.remove('online');
                video.srcObject = null;
                if (pc) pc.close();
                pc = null;
            }
        };

        // ----------- 2. FACE-API INTEGRATION -----------
        async function loadModelsAndDataset() {
            try {
                statusPill.textContent = 'LOADING AI MODELS...';
                await faceapi.nets.ssdMobilenetv1.loadFromUri('/models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('/models');

                statusPill.textContent = 'BUILDING DATASET...';
                const res = await fetch('/dataset');
                const images = await res.json();

                const labeledDescriptors = [];

                for (const filename of images) {
                    const img = await faceapi.fetchImage(`/dataset/${filename}`);
                    const detections = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();

                    if (detections) {
                        // Strip extension and cleanup name for display
                        let label = filename.split('.')[0];
                        label = label.replace(/_[0-9]+$/, '').replace(/[_|-]/g, ' ');
                        // e.g. john_smith_1.jpg -> john smith

                        // Check if label already exists (to merge descriptors if multiple images of same person)
                        const existing = labeledDescriptors.find(l => l.label.toLowerCase() === label.toLowerCase());
                        if (existing) {
                            existing.descriptors.push(detections.descriptor);
                        } else {
                            labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(label.toUpperCase(), [detections.descriptor]));
                        }
                    }
                }

                if (labeledDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
                    console.log(`✅ Loaded dataset: ${labeledDescriptors.length} identities processed.`);
                }

                statusPill.textContent = 'WAITING FOR STREAM';
            } catch (e) {
                console.error('AI Loading Error:', e);
                statusPill.textContent = 'AI LOAD ERROR';
            }
        }

        // ----------- 3. LIVE DETECTION LOOP -----------
        video.addEventListener('play', () => {
            // Setup canvas size to match video exactly
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            let loopId;
            async function detectLoop() {
                if (video.paused || video.ended || !video.srcObject) return;

                displaySize.width = video.clientWidth;
                displaySize.height = video.clientHeight;
                faceapi.matchDimensions(canvas, displaySize);

                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let activeMatches = [];

                resizedDetections.forEach(detection => {
                    let boxColor = '#555963'; // Grey for unknown
                    let labelText = 'UNKNOWN';
                    let conf = 0;

                    if (faceMatcher) {
                        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                        if (bestMatch.label !== 'unknown') {
                            boxColor = '#f0a832'; // Amber for known
                            // Convert face-api distance to a typical confidence percentage score
                            conf = Math.round((1 - bestMatch.distance) * 100);
                            const cappedConf = Math.min(100, Math.max(0, conf));
                            labelText = `${bestMatch.label} - ${cappedConf}% CONFIDENT`;
                            activeMatches.push({ name: bestMatch.label, conf: cappedConf });
                        }
                    }

                    const box = detection.detection.box;
                    // Draw Box
                    ctx.strokeStyle = boxColor;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);

                    // Draw Label background
                    ctx.fillStyle = boxColor;
                    ctx.fillRect(box.x, box.y - 20, box.width, 20);

                    // Draw Text
                    ctx.fillStyle = boxColor === '#f0a832' ? '#000' : '#fff';
                    ctx.font = 'bold 12px "IBM Plex Mono", monospace';
                    ctx.fillText(labelText, box.x + 4, box.y - 6);
                });

                updateBottomPanel(activeMatches);

                loopId = requestAnimationFrame(detectLoop);
            }

            detectLoop();
        });

        function updateBottomPanel(matches) {
            matchCounter.textContent = matches.length;

            if (matches.length === 0) {
                matchesList.innerHTML = `<div class="match-row" style="color:#5c5f66;justify-content:center;">Awaiting active detections...</div>`;
            } else {
                matchesList.innerHTML = matches.map(m => `
          <div class="match-row">
            <div class="match-avatar verified"></div>
            <div class="match-info">
              <span class="match-name">${m.name}</span>
              <div class="match-progress"><div class="fill" style="width: ${m.conf}%"></div></div>
            </div>
            <span class="match-conf high">${m.conf}% CONFIDENT</span>
          </div>
        `).join('');
            }
        }

        // Start loading AI as soon as page hits
        window.addEventListener('load', loadModelsAndDataset);

    </script>
</body>

</html>
